<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pengubah Warna Latar Belakang</title>
</head>

<body>
    <h1>Tombol Pengubah Warna Latar Belakang Secara Acak - T5_065</h1>

    <button id="tombolWarna">Ganti Warna</button>

    <script>
        const tombol = document.getElementById('tombolWarna');

        tombol.addEventListener('click', () => {
            const warnaAcak = '#' + Math.floor(Math.random() * 16777215).toString(16);
            document.body.style.backgroundColor = warnaAcak;
        });
    </script>
</body>

</html>
